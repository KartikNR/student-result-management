<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Result Management System</h1>

        <p class="subtitle">Enter Student Details and Marks</p>

        <form action="/" method="POST">

            <label for="name">Student Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter student name" required>

            <label for="marks1">Marks 1</label>
            <input type="number" id="marks1" name="marks1"
                   placeholder="Enter marks" min="0" max="100" required>

            <label for="marks2">Marks 2</label>
            <input type="number" id="marks2" name="marks2"
                   placeholder="Enter marks" min="0" max="100" required>

            <label for="marks3">Marks 3</label>
            <input type="number" id="marks3" name="marks3"
                   placeholder="Enter marks" min="0" max="100" required>

            <button type="submit">Calculate Result</button>

        </form>

    </div>

</body>
</html>
